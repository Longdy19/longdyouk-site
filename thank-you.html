<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  <title>Thank You — Longdy Ouk</title>
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink: #111827; --navy: #0f172a; --gold: #c8a96a; --body: #536176; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: linear-gradient(115deg, #fff 35%, #faf9f6 100%); color: var(--ink); font-family: "DM Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    header { min-height: 82px; padding: 14px max(24px, calc((100% - 1160px) / 2)); display: flex; align-items: center; border-bottom: 1px solid rgba(16,24,44,.08); background: rgba(255,255,255,.94); }
    header img { display: block; width: min(280px, 70vw); height: auto; }
    main { width: min(760px, calc(100% - 40px)); margin: auto; padding: 72px 0; text-align: center; }
    .eyebrow { margin-bottom: 16px; color: #957744; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 auto 18px; font-family: "Playfair Display", Georgia, serif; font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1.08; }
    main p { margin: 0 auto 30px; color: var(--body); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.8; }
    .button { display: inline-flex; min-height: 54px; align-items: center; justify-content: center; padding: 13px 25px; border: 1px solid var(--navy); border-radius: 999px; background: var(--navy); color: #fff; font-weight: 600; text-decoration: none; transition: background .2s ease, color .2s ease; }
    .button:hover { background: transparent; color: var(--navy); }
    .button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    footer { padding: 20px; color: var(--body); font-size: .85rem; text-align: center; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header><a href="/" aria-label="Longdy Ouk home"><img src="logo-h.png" alt="Longdy Ouk, Strategic Excellence Architect"></a></header>
  <main>
    <div class="eyebrow">Inquiry received</div>
    <h1>Thank you for reaching out.</h1>
    <p>Your message was submitted successfully.</p>
    <a class="button" href="/">Return to the website</a>
  </main>
  <footer>© 2026 Longdy Ouk — Strategic Excellence Architect</footer>
</body>
</html>
